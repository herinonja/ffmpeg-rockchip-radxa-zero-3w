name: Build FFmpeg Rockchip for Radxa Zero 3W

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      PREFIX: ${{ github.workspace }}/ffmpeg-rk3566-rootfs/usr/local
      SYSROOT: ${{ github.workspace }}/ffmpeg-rk3566-rootfs
      CROSS: aarch64-linux-gnu

    steps:
      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y \
            git build-essential cmake ninja-build meson pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            yasm nasm python3 tar xz-utils

      - name: Verify ARM64 toolchain
        run: |
          ${CROSS}-gcc -v
          ${CROSS}-ld -v

      - name: Create Meson ARM64 cross file
        run: |
          cat > cross-aarch64.txt <<EOF
          [binaries]
          c = '/usr/bin/${CROSS}-gcc'
          cpp = '/usr/bin/${CROSS}-g++'
          ar = '/usr/bin/${CROSS}-ar'
          strip = '/usr/bin/${CROSS}-strip'
          pkgconfig = 'pkg-config'
          
          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

      - name: Clone libdrm
        run: |
          git clone --depth=1 https://gitlab.freedesktop.org/mesa/drm.git libdrm

      - name: Build libdrm for ARM64
        run: |
          meson setup libdrm/build libdrm \
            --cross-file cross-aarch64.txt \
            --prefix="$PREFIX" \
            --libdir=lib \
            --buildtype=release \
            -Dudev=false \
            -Dcairo-tests=disabled \
            -Dman-pages=disabled \
            -Dvalgrind=disabled

          ninja -C libdrm/build
          ninja -C libdrm/build install

      - name: Clone MPP
        run: |
          git clone --depth=1 https://github.com/rockchip-linux/mpp.git

      - name: Build MPP for ARM64
        run: |
          cmake -S mpp -B mpp/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/usr/bin/${CROSS}-gcc \
            -DCMAKE_CXX_COMPILER=/usr/bin/${CROSS}-g++ \
            -DCMAKE_AR=/usr/bin/${CROSS}-ar \
            -DCMAKE_AS=/usr/bin/${CROSS}-as \
            -DCMAKE_LINKER=/usr/bin/${CROSS}-ld \
            -DCMAKE_NM=/usr/bin/${CROSS}-nm \
            -DCMAKE_OBJCOPY=/usr/bin/${CROSS}-objcopy \
            -DCMAKE_OBJDUMP=/usr/bin/${CROSS}-objdump \
            -DCMAKE_RANLIB=/usr/bin/${CROSS}-ranlib \
            -DCMAKE_STRIP=/usr/bin/${CROSS}-strip

          cmake --build mpp/build -j"$(nproc)"
          cmake --install mpp/build

      - name: Clone librga
        run: |
          git clone --depth=1 https://github.com/airockchip/librga.git

      - name: Install librga prebuilt ARM64
        run: |
          mkdir -p "$PREFIX/include"
          mkdir -p "$PREFIX/include/rga"
          mkdir -p "$PREFIX/lib"
          mkdir -p "$PREFIX/lib/pkgconfig"

          cp -av librga/include/* "$PREFIX/include/"
          cp -av librga/include/* "$PREFIX/include/rga/"

          cp -av librga/libs/Linux/gcc-aarch64/librga.so "$PREFIX/lib/"
          ln -sf librga.so "$PREFIX/lib/librga.so.2"

          cat > "$PREFIX/lib/pkgconfig/librga.pc" <<EOF
          prefix=$PREFIX
          exec_prefix=\${prefix}
          libdir=\${prefix}/lib
          includedir=\${prefix}/include
          
          Name: librga
          Description: Rockchip RGA library
          Version: 2.2.0
          Libs: -L\${libdir} -lrga
          Cflags: -I\${includedir} -I\${includedir}/rga
          EOF

          cp "$PREFIX/lib/pkgconfig/librga.pc" "$PREFIX/lib/pkgconfig/rga.pc"

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"

          ls -la "$PREFIX/lib/pkgconfig"
          pkg-config --modversion librga
          pkg-config --cflags --libs librga
          file "$PREFIX/lib/librga.so"

      - name: Clone ffmpeg-rockchip
        run: |
          git clone --depth=1 https://github.com/nyanmisaka/ffmpeg-rockchip.git

      - name: Configure FFmpeg Rockchip
        working-directory: ffmpeg-rockchip
        run: |
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR=""
          export LD_LIBRARY_PATH="$PREFIX/lib"

          pkg-config --modversion libdrm
          pkg-config --modversion rockchip_mpp
          pkg-config --modversion librga
          pkg-config --cflags --libs libdrm rockchip_mpp librga

          ./configure \
            --prefix="$PREFIX" \
            --arch=aarch64 \
            --target-os=linux \
            --cross-prefix=${CROSS}- \
            --cc=/usr/bin/${CROSS}-gcc \
            --cxx=/usr/bin/${CROSS}-g++ \
            --pkg-config=pkg-config \
            --enable-cross-compile \
            --enable-version3 \
            --enable-gpl \
            --enable-rkmpp \
            --enable-rkrga \
            --enable-libdrm \
            --enable-pthreads \
            --enable-small \
            --disable-debug \
            --disable-doc \
            --disable-static \
            --enable-shared \
            --extra-cflags="-I$PREFIX/include -I$PREFIX/include/rga -I$PREFIX/include/libdrm" \
            --extra-ldflags="-L$PREFIX/lib" \
            --extra-libs="-lrga -ldrm"

      - name: Build FFmpeg
        working-directory: ffmpeg-rockchip
        run: |
          make -j"$(nproc)"
          make install

      - name: Verify built binaries
        run: |
          file "$PREFIX/bin/ffmpeg"
          readelf -h "$PREFIX/bin/ffmpeg" | grep Machine || true
          "$PREFIX/bin/ffmpeg" -version || true
          "$PREFIX/bin/ffmpeg" -decoders | grep rkmpp || true
          "$PREFIX/bin/ffmpeg" -filters | grep rkrga || true

      - name: Package artifact
        run: |
          mkdir -p package
          tar -C "$SYSROOT" -cJf package/ffmpeg-rockchip-radxa-zero3w-rk3566-arm64.tar.xz usr

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-rockchip-radxa-zero3w-rk3566-arm64
          path: package/*.tar.xz

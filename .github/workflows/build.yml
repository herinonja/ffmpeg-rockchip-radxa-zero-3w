name: Build FFmpeg Rockchip for Radxa Zero 3W

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      PREFIX: ${{ github.workspace }}/ffmpeg-rk3566-rootfs/usr/local
      SYSROOT: ${{ github.workspace }}/ffmpeg-rk3566-rootfs
      CROSS: aarch64-linux-gnu

    steps:
      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y \
            git build-essential cmake ninja-build pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            yasm nasm python3 tar xz-utils libdrm-dev

      - name: Verify ARM64 toolchain
        run: |
          ${CROSS}-gcc -v
          ${CROSS}-ld -v

      - name: Clone MPP
        run: |
          git clone --depth=1 https://github.com/rockchip-linux/mpp.git

      - name: Build MPP for ARM64
        run: |
          cmake -S mpp -B mpp/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/usr/bin/${CROSS}-gcc \
            -DCMAKE_CXX_COMPILER=/usr/bin/${CROSS}-g++ \
            -DCMAKE_AR=/usr/bin/${CROSS}-ar \
            -DCMAKE_AS=/usr/bin/${CROSS}-as \
            -DCMAKE_LINKER=/usr/bin/${CROSS}-ld \
            -DCMAKE_NM=/usr/bin/${CROSS}-nm \
            -DCMAKE_OBJCOPY=/usr/bin/${CROSS}-objcopy \
            -DCMAKE_OBJDUMP=/usr/bin/${CROSS}-objdump \
            -DCMAKE_RANLIB=/usr/bin/${CROSS}-ranlib \
            -DCMAKE_STRIP=/usr/bin/${CROSS}-strip

          cmake --build mpp/build -j"$(nproc)"
          cmake --install mpp/build

      - name: Clone librga
        run: |
          git clone --depth=1 https://github.com/airockchip/librga.git

      - name: Build librga for ARM64
        run: |
          cmake -S librga -B librga/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/usr/bin/${CROSS}-gcc \
            -DCMAKE_CXX_COMPILER=/usr/bin/${CROSS}-g++ \
            -DCMAKE_AR=/usr/bin/${CROSS}-ar \
            -DCMAKE_AS=/usr/bin/${CROSS}-as \
            -DCMAKE_LINKER=/usr/bin/${CROSS}-ld \
            -DCMAKE_NM=/usr/bin/${CROSS}-nm \
            -DCMAKE_OBJCOPY=/usr/bin/${CROSS}-objcopy \
            -DCMAKE_OBJDUMP=/usr/bin/${CROSS}-objdump \
            -DCMAKE_RANLIB=/usr/bin/${CROSS}-ranlib \
            -DCMAKE_STRIP=/usr/bin/${CROSS}-strip

          cmake --build librga/build -j"$(nproc)"
          cmake --install librga/build

      - name: Clone ffmpeg-rockchip
        run: |
          git clone --depth=1 https://github.com/nyanmisaka/ffmpeg-rockchip.git

      - name: Configure FFmpeg Rockchip
        working-directory: ffmpeg-rockchip
        run: |
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PREFIX/lib/aarch64-linux-gnu/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PKG_CONFIG_PATH"
          export CFLAGS="-I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib -L$PREFIX/lib/aarch64-linux-gnu"

          ./configure \
            --prefix="$PREFIX" \
            --arch=aarch64 \
            --target-os=linux \
            --cross-prefix=${CROSS}- \
            --cc=/usr/bin/${CROSS}-gcc \
            --cxx=/usr/bin/${CROSS}-g++ \
            --enable-cross-compile \
            --enable-version3 \
            --enable-gpl \
            --enable-rkmpp \
            --enable-rkrga \
            --enable-libdrm \
            --enable-pthreads \
            --enable-small \
            --disable-debug \
            --disable-doc \
            --disable-static \
            --enable-shared

      - name: Build FFmpeg
        working-directory: ffmpeg-rockchip
        run: |
          make -j"$(nproc)"
          make install

      - name: Verify built binaries
        run: |
          file "$PREFIX/bin/ffmpeg"
          "$PREFIX/bin/ffmpeg" -version || true
          readelf -h "$PREFIX/bin/ffmpeg" | grep Machine

      - name: Package artifact
        run: |
          mkdir -p package
          tar -C "$SYSROOT" -cJf package/ffmpeg-rockchip-radxa-zero3w-rk3566-arm64.tar.xz usr

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-rockchip-radxa-zero3w-rk3566-arm64
          path: package/*.tar.xz

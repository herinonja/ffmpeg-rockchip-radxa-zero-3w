name: Build FFmpeg Rockchip for Radxa Zero 3W

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      PREFIX: ${{ github.workspace }}/ffmpeg-rk3566-rootfs/usr/local
      SYSROOT: ${{ github.workspace }}/ffmpeg-rk3566-rootfs
      CROSS: aarch64-linux-gnu

    steps:
      - name: Install build deps
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt update

          sudo apt install -y \
            git build-essential cmake ninja-build pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            yasm nasm python3 tar xz-utils \
            libdrm-dev:arm64

      - name: Verify ARM64 toolchain and libdrm
        run: |
          ${CROSS}-gcc -v
          ${CROSS}-ld -v

          export PKG_CONFIG_LIBDIR="/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          pkg-config --modversion libdrm
          pkg-config --libs libdrm
          pkg-config --cflags libdrm

      - name: Clone MPP
        run: |
          git clone --depth=1 https://github.com/rockchip-linux/mpp.git

      - name: Build MPP for ARM64
        run: |
          cmake -S mpp -B mpp/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/usr/bin/${CROSS}-gcc \
            -DCMAKE_CXX_COMPILER=/usr/bin/${CROSS}-g++ \
            -DCMAKE_AR=/usr/bin/${CROSS}-ar \
            -DCMAKE_AS=/usr/bin/${CROSS}-as \
            -DCMAKE_LINKER=/usr/bin/${CROSS}-ld \
            -DCMAKE_NM=/usr/bin/${CROSS}-nm \
            -DCMAKE_OBJCOPY=/usr/bin/${CROSS}-objcopy \
            -DCMAKE_OBJDUMP=/usr/bin/${CROSS}-objdump \
            -DCMAKE_RANLIB=/usr/bin/${CROSS}-ranlib \
            -DCMAKE_STRIP=/usr/bin/${CROSS}-strip

          cmake --build mpp/build -j"$(nproc)"
          cmake --install mpp/build

      - name: Clone librga
        run: |
          git clone --depth=1 https://github.com/airockchip/librga.git

      - name: Install librga prebuilt ARM64
        run: |
          mkdir -p "$PREFIX/include"
          mkdir -p "$PREFIX/lib"
          mkdir -p "$PREFIX/lib/pkgconfig"

          cp -av librga/include/* "$PREFIX/include/"
          cp -av librga/libs/Linux/gcc-aarch64/librga.so "$PREFIX/lib/"

          ln -sf librga.so "$PREFIX/lib/librga.so.2"

          cat > "$PREFIX/lib/pkgconfig/librga.pc" <<EOF
prefix=$PREFIX
exec_prefix=\${prefix}
libdir=\${prefix}/lib
includedir=\${prefix}/include

Name: librga
Description: Rockchip RGA userspace library
Version: 1.10.0
Libs: -L\${libdir} -lrga
Cflags: -I\${includedir}
EOF

      - name: Clone ffmpeg-rockchip
        run: |
          git clone --depth=1 https://github.com/nyanmisaka/ffmpeg-rockchip.git

      - name: Configure FFmpeg Rockchip
        working-directory: ffmpeg-rockchip
        run: |
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"

          export CFLAGS="-I$PREFIX/include -I/usr/include -I/usr/include/libdrm"
          export LDFLAGS="-L$PREFIX/lib -L/usr/lib/aarch64-linux-gnu"

          ./configure \
            --prefix="$PREFIX" \
            --arch=aarch64 \
            --target-os=linux \
            --cross-prefix=${CROSS}- \
            --cc=/usr/bin/${CROSS}-gcc \
            --cxx=/usr/bin/${CROSS}-g++ \
            --pkg-config=pkg-config \
            --enable-cross-compile \
            --enable-version3 \
            --enable-gpl \
            --enable-rkmpp \
            --enable-rkrga \
            --enable-libdrm \
            --enable-pthreads \
            --enable-small \
            --disable-debug \
            --disable-doc \
            --disable-static \
            --enable-shared

      - name: Build FFmpeg
        working-directory: ffmpeg-rockchip
        run: |
          make -j"$(nproc)"
          make install

      - name: Verify built binaries
        run: |
          file "$PREFIX/bin/ffmpeg"
          readelf -h "$PREFIX/bin/ffmpeg" | grep Machine || true
          "$PREFIX/bin/ffmpeg" -version || true
          "$PREFIX/bin/ffmpeg" -decoders | grep rkmpp || true
          "$PREFIX/bin/ffmpeg" -filters | grep rkrga || true

      - name: Package artifact
        run: |
          mkdir -p package
          tar -C "$SYSROOT" -cJf package/ffmpeg-rockchip-radxa-zero3w-rk3566-arm64.tar.xz usr

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-rockchip-radxa-zero3w-rk3566-arm64
          path: package/*.tar.xz
